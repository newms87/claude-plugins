     ---------------------------------------------------------------------------
     1. THE ONE RULE THAT SHAPES THE WHOLE FILE
     ---------------------------------------------------------------------------
     STATUS IS A FIELD. TABS ARE FILTERS.

     Every work item lives in ONE array: DATA.work. The three work tabs
     (Needs Attention / In Progress / Completed) are VIEWS over that single
     array, filtered on item.status. To move an item between tabs you change
     its `status` string. You NEVER move an object between arrays, and you

     created until the end of the project.

     ---------------------------------------------------------------------------
     kind "work"  (DATA.work — read by Needs Attention, In Progress, Completed)
       {
         id:      "W-1",                       // permanent, append-only
         status:  "attention" | "progress" | "done",
         priority:"critical" | "very_high" | "high" | "medium" | "low" | "lowest",
                                               // REQUIRED on every work item. The page
                                               // sorts by this by DEFAULT, so an unset
                                               // priority silently reads as "medium" and
                                               // buries a critical item mid-list. Rank by
                                               // CONSEQUENCE IF IGNORED, not by how
                                               // interesting the item is or how long it
                                               // took to find. Same vocabulary as the
                                               // tracker card's priority, so the two agree.
         ts:      "YYYY-MM-DD HH:MM UTC",      // real clock, see rule 4
         title:   "Short imperative or noun phrase",
         problem: "1-3 sentences. ALWAYS VISIBLE. The queue must be scannable
                   without expanding anything, so this is the whole point in
                   plain language, not a pointer to detail below.",
         context: "Background, evidence, what was checked. Collapsed by default.",
         solutions: [                          // optional; omit or [] if none
           // If this array is non-empty, EXACTLY ONE entry MUST carry recommended:true.
           // You did the investigation; withholding a pick is not neutrality, it hands
           // the human an unranked menu. Recommending is NOT deciding — the item stays
           // in Needs Attention until they answer. Say so in the pro/con, not by abstaining.
           { key:"A", text:"Stated as an outcome/behavior, not an implementation.",
             pro:"What this buys.", con:"What this costs.", recommended:true }
         ],
         resolution: { date:"YYYY-MM-DD", text:"What was decided and why." } | null,
         tags: ["optional","labels"]
       }

     kind "items" (DATA.goals / DATA.arch / DATA.rules / DATA.caveats)
       { id:"GOA-1", ts:"YYYY-MM-DD HH:MM UTC", title:"...", body:"...",
         status:"open" | "decided" | "blocked", tags:[] }

     kind "timeline" (DATA.timeline)
       { id:"TL-1", time:"HH:MM UTC" (or a full date-time), title:"...",
         body:"...", severity:"ok" | "warn" | "crit" }
       Timeline has no separate `ts` — `time` IS its timestamp.

     ID prefixes, one per array, never reused across arrays:
       W-n  work        GOA-n goals    ARC-n architecture
       RUL-n rules      CAV-n caveats  TL-n  timeline

     ---------------------------------------------------------------------------
     2b. PRIORITY IS REQUIRED, AND IT IS THE DEFAULT SORT
     ---------------------------------------------------------------------------
     Every work item carries `priority`. The page sorts by it by default, so the
     top of Needs Attention is a ranked queue rather than a pile — the human reads
     downward and stops when they run out of time, and what they skipped is what
     you said mattered least.

     Rank by CONSEQUENCE IF IGNORED. Not by how long the investigation took, not
     by how interesting the finding is, not by how recently you found it, and
     never by how much you want it looked at. A defect that silently corrupts a
     user's data outranks a defect that loudly stops a test run, because the loud
     one announces itself and the silent one does not.

     critical   data loss, data corruption, a security or privacy exposure, or
                anything already affecting production right now
     very_high  blocks the stated goal, or blocks the human from trusting a
                result they are about to act on
     high       a real defect with a real consequence, not yet biting
     medium     the default. Worth doing; nothing breaks while it waits
     low        cleanup, consistency, ergonomics
     lowest     noted so it is not rediscovered; may never be done

     An absent priority ranks as `medium` rather than last, so a forgotten field
     degrades to mid-list instead of silently burying the item. Re-rank when the
     evidence changes — a finding that turns out to be a checker artifact drops,
     and one that turns out to be reaching production climbs.

     ---------------------------------------------------------------------------
     3. IDS ARE PERMANENT
     ---------------------------------------------------------------------------
     Append only. Never renumber to close a gap. Never re-prefix. A deleted
     item's number is retired, not recycled. The human refers to entries by id
     in chat ("what happened to W-4?") and an id that shifted meaning is worse
     than a missing entry.

     ---------------------------------------------------------------------------
     4. TIMESTAMPS COME FROM THE REAL CLOCK
     ---------------------------------------------------------------------------
     Every work and items entry carries `ts`. READ IT FROM THE ACTUAL CLOCK when
     you write the entry — never compute it, never estimate it, never copy the
     one above and add a plausible-looking few minutes. Bump `ts` every single
     time you touch that entry, including a one-word edit. `ts` is how the human
     spots a stale item without re-reading the page; a wrong timestamp is worse
     than no timestamp, because it makes a stale item look fresh.

     ---------------------------------------------------------------------------
     5. UPDATE CADENCE, AND WHAT COUNTS AS THE RECORD
     ---------------------------------------------------------------------------
     - Update this page after EVERY action taken and EVERY new finding —
       including "checked, nothing changed." Never batch updates to the end.
     - This page is the ONLY record. No parallel plan file, no scratch .md, no
       "I'll summarize in chat." Chat is a pointer ("see W-3") plus one line of
       status. If it is not on this page, it is not recorded.
     - Load-bearing claims are labeled: Verified / Unverified / Unknown. A claim
       with no label reads as verified, so label it or check it.
     - When context is running low, write a "Resume here" item — where the work
       stands, the next concrete action, and what a fresh reader must not
       re-litigate — as the FIRST entry in IN PROGRESS. It is written for the
       next agent, so it never goes in Needs Attention, which belongs to the
       human alone (see the tab rule). Putting agent state at the top of their
       queue is how that queue stops being worth reading.
     - If a tracker card exists for this work, put its id in Goals and put this
       page's URL on the card, so neither can be found without the other.

     ---------------------------------------------------------------------------
     6. PUBLISHING — the Artifact tool
     ---------------------------------------------------------------------------
     - Publishing IS the render. Publish the file and look at the page. Never
       stand up a local server, a build step, or any preview harness for this.
     - This file deliberately has NO document-skeleton tags — no DOCTYPE
       declaration and no "html", "head" or "body" element. The Artifact tool
       wraps the content in its own skeleton at publish time. Do not add them
       back; a second skeleton nested inside the tool's own is invalid markup.
     - `favicon`: required on the FIRST publish (one or two emoji). It must
       NEVER change afterwards — readers find the tab by its icon. Omit the
       parameter on every redeploy.
     - Pass a one-sentence `description`; it becomes the gallery card subtitle.
     - Republish the SAME file path (or pass the artifact `url`) to keep the
       same URL. A different path creates a second, orphaned artifact.
     - BEFORE PUBLISHING: confirm the DATA object below is valid JavaScript —
       balanced braces and brackets, a comma between every entry, quotes escaped
       inside strings. One stray comma renders a blank page.
     ============================================================================ -->
<script>
// ============================================================================
// DATA — this is the section you edit. Everything under "RENDER ENGINE" is
// generic and reads PROJECT + TABS + DATA to build the entire page.
// ============================================================================

const PROJECT = {
  name: "PROJECT NAME",
  sub: "org/repo · living plan · current focus in a few words",
  logo: "XX",
};

// The eight tabs. `from` names the DATA array; `status` (work tabs only) is the
// filter applied to it. `rule` is rendered under the tab heading and is how this
// page teaches its own conventions to a reader who has no skill loaded — keep
// each one written, current, and honest.
const TABS = [
  {
    key: "attention", label: "Needs Attention", prefix: "W", kind: "work",
    from: "work", status: "attention", badge: "alert",
    rule: "THIS TAB BELONGS TO THE HUMAN. Only things that are undecided AND need THEM specifically — a judgement only they can make, or a fact only they can supply. If the decision follows from something they already ruled, or from evidence already in hand, it is not theirs: decide it, say so in the resolution, and move it to In Progress. Agent-facing state — what to resume, what is in flight, what not to re-litigate — lives in In Progress, never here. A recommended option is not a decision, so an item with a recommendation still lives here until they answer. The moment something is decided it leaves this tab by changing its status, never by moving it to another array.",
  },
  {
    key: "progress", label: "In Progress", prefix: "W", kind: "work",
    from: "work", status: "progress",
    rule: "Decided and actively being worked on. Nothing here is waiting on the human — if it starts waiting, set its status back to attention and say what is needed.",
  },
  {
    key: "done", label: "Completed", prefix: "W", kind: "work",
    from: "work", status: "done",
    rule: "Finished work, each with its resolution stated up front. Rejected options stay in the fold so a decision is never quietly re-litigated later by someone who cannot see what was already ruled out.",
  },
  {
    key: "goals", label: "Goals", prefix: "GOA", kind: "items", from: "goals",
    rule: "What “done” means for this work, and — just as important — what is explicitly out of scope. If a goal cannot be checked off by looking at something real, it is not written sharply enough yet.",
  },
  {
    key: "arch", label: "Architecture", prefix: "ARC", kind: "items", from: "arch",
    rule: "System design and components: what exists, what talks to what, where a thing lives. Describe the shape of the system, not the sequence of work — sequencing belongs in the work items.",
  },
  {
    key: "rules", label: "Rules", prefix: "RUL", kind: "items", from: "rules",
    rule: "Invariants and domain logic that must hold no matter what gets built. A rule is something a future change could violate; if nothing could violate it, it is a description, and it belongs in Architecture.",
  },
  {
    key: "caveats", label: "Caveats", prefix: "CAV", kind: "items", from: "caveats",
    rule: "Known gaps, contradictions between sources, what is verified versus assumed, and FYI findings with no action attached. Anything that WOULD need action goes to Needs Attention instead — this tab is where a finding rests when nobody has to do anything about it.",
  },
  {
    key: "timeline", label: "Timeline", prefix: "TL", kind: "timeline", from: "timeline",
    rule: "Chronological log of what actually happened, newest last. A quiet stretch still gets an entry saying it was quiet — an unexplained gap is indistinguishable from nobody having checked.",
  },
];

const DATA = {
  // ONE array. The first three tabs are views over it, filtered on `status`.
  // Changing a status moves an item between tabs; the item itself never moves.
  work: [
    {
      id: "W-1", status: "attention", priority: "critical", ts: "2026-01-01 00:00 UTC",
      title: "EXAMPLE — an undecided thing the human must call",
      problem: "One to three sentences that make this scannable without expanding anything. State what is blocked and what the human has to choose between.",
      context: "Background and evidence. What was checked, what it showed, why this could not be settled without asking. Collapsed — the queue stays readable.",
      solutions: [
        { key: "A", text: "First option, stated as an outcome.", pro: "What it buys.", con: "What it costs." },
        { key: "B", text: "Second option, stated as an outcome.", pro: "What it buys.", con: "What it costs.", recommended: true },
      ],
      resolution: null,
      tags: ["example"],
    },
    {
      id: "W-2", status: "attention", priority: "high", ts: "2026-01-01 00:00 UTC",
      title: "EXAMPLE — an item with a recommendation is still undecided",
      problem: "A recommended option does not decide anything. This stays in Needs Attention until the human answers.",
      context: "Delete this example entry once real work exists.",
      solutions: [],
      resolution: null,
      tags: [],
    },
    {
      id: "W-3", status: "progress", priority: "medium", ts: "2026-01-01 00:00 UTC",
      title: "EXAMPLE — decided, being worked, not waiting on anyone",
      problem: "Say what is being built and how far along it is. If this starts waiting on the human, set status back to “attention”.",
      context: "Optional detail on approach.",
      solutions: [],
      resolution: null,
      tags: [],
    },
    {
      id: "W-4", status: "done", priority: "low", ts: "2026-01-01 00:00 UTC",
      title: "EXAMPLE — finished, with the resolution as the headline",
      problem: "The original problem stays here so the completed item still reads on its own.",
      context: "What was tried, what was checked.",
      solutions: [
        { key: "A", text: "The rejected option, kept so it is not re-proposed.", pro: "Simpler.", con: "Loses the guarantee we needed." },
        { key: "B", text: "The chosen option.", pro: "Holds the guarantee.", con: "More code.", recommended: true },
      ],
      resolution: { date: "2026-01-01", text: "Chose B. Stated plainly, with the reason, so nobody reopens it." },
      tags: [],
    },
  ],

  goals: [
    { id: "GOA-1", ts: "2026-01-01 00:00 UTC", title: "EXAMPLE — what “done” means", body: "A checkable statement. Someone can look at something real and say yes or no.", status: "open", tags: ["scope"] },
    { id: "GOA-2", ts: "2026-01-01 00:00 UTC", title: "EXAMPLE — explicitly out of scope", body: "Name what this work is NOT doing, so it does not creep back in.", status: "decided", tags: ["out-of-scope"] },
  ],

  arch: [
    { id: "ARC-1", ts: "2026-01-01 00:00 UTC", title: "EXAMPLE — a component and its job", body: "What it is, what it owns, what it talks to.", status: "decided", tags: [] },
    { id: "ARC-2", ts: "2026-01-01 00:00 UTC", title: "EXAMPLE — a boundary", body: "Where one side stops and the other begins, and what crosses it.", status: "decided", tags: [] },
  ],

  rules: [
    { id: "RUL-1", ts: "2026-01-01 00:00 UTC", title: "EXAMPLE — an invariant", body: "Something a future change could violate. State it so a violation is recognizable.", status: "decided", tags: [] },
    { id: "RUL-2", ts: "2026-01-01 00:00 UTC", title: "EXAMPLE — domain logic that must hold", body: "The rule, plus the consequence of breaking it.", status: "decided", tags: [] },
  ],

  caveats: [
    { id: "CAV-1", ts: "2026-01-01 00:00 UTC", title: "EXAMPLE — verified vs assumed", body: "Verified: the part that was actually checked, and how. Unverified: the part taken on faith.", status: "open", tags: ["evidence"] },
    { id: "CAV-2", ts: "2026-01-01 00:00 UTC", title: "EXAMPLE — an FYI with no action attached", body: "A real finding nobody has to act on. If it needed action it would be a work item instead.", status: "open", tags: [] },
  ],

  timeline: [
    { id: "TL-1", time: "2026-01-01 00:00 UTC", title: "EXAMPLE — started", body: "Baseline captured.", severity: "ok" },
    { id: "TL-2", time: "2026-01-01 00:15 UTC", title: "EXAMPLE — quiet stretch still gets an entry", body: "Checked, nothing changed. A gap in this log is indistinguishable from not having checked.", severity: "ok" },
    { id: "TL-3", time: "2026-01-01 00:30 UTC", title: "EXAMPLE — something went wrong", body: "What happened and what it means.", severity: "warn" },
  ],
};

// ============================================================================
// RENDER ENGINE — generic. Reads PROJECT + TABS + DATA. Touch this only if a
// tab genuinely needs a new entry shape beyond work / items / timeline.
// ============================================================================
(function () {
  const $tabs = document.getElementById("tabs");
  const $rule = document.getElementById("rule");
  const $panels = document.getElementById("panels");
  const $filters = document.getElementById("filters");
  const $q = document.getElementById("q");
  const $sort = document.getElementById("sort");

  let active = TABS.length ? TABS[0].key : null;
  let filter = "all";
  // Priority is the DEFAULT sort everywhere. A reader opening this page should see
  // the most consequential thing first without touching a control; the other sorts
  // exist for when they are hunting a specific entry rather than triaging.
  let sortBy = "priority";
  const PRIORITY_RANK = { critical: 0, very_high: 1, high: 2, medium: 3, low: 4, lowest: 5 };
  const PRIORITY_LABEL = { critical: "Critical", very_high: "Very high", high: "High", medium: "Medium", low: "Low", lowest: "Lowest" };
  // An entry with no priority ranks as medium rather than last, so a forgotten field
  // degrades to "middle of the list" instead of silently hiding the item at the bottom.
  function priorityRank(p) { return PRIORITY_RANK[p] == null ? 3 : PRIORITY_RANK[p]; }
  const queries = {};                                  // per-tab search text

  document.getElementById("h1").textContent = PROJECT.name;
  document.getElementById("sub").textContent = PROJECT.sub;
  document.getElementById("logo").textContent = PROJECT.logo;

  // ---- helpers -------------------------------------------------------------
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function mark(s, term) {
    const e = esc(s);
    if (!term) return e;
    const rx = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
    return e.replace(rx, "<mark>$1</mark>");
  }
  function pillClass(status) {
    return {
      attention: "p-attention", progress: "p-progress", done: "p-done",
      open: "p-open", decided: "p-decided", blocked: "p-blocked",
    }[status] || "p-tag";
  }
  function statusLabel(status) {
    return { attention: "needs attention", progress: "in progress", done: "completed" }[status] || status;
  }
  function tabOf(key) { return TABS.filter(function (t) { return t.key === key; })[0]; }

  // A tab's rows: its source array, narrowed by the tab's own status filter.
  function rowsFor(tab) {
    const all = DATA[tab.from] || [];
    return tab.status ? all.filter(function (e) { return e.status === tab.status; }) : all;
  }

  // ---- chrome --------------------------------------------------------------
  function buildTabs() {
    $tabs.innerHTML = "";
    TABS.forEach(function (t) {
      const n = rowsFor(t).length;
      const b = document.createElement("button");
      b.type = "button";
      b.dataset.key = t.key;
      b.className = t.key === active ? "on" : "";
      b.setAttribute("aria-pressed", String(t.key === active));
      const cls = "cnt" + (t.badge === "alert" && n > 0 ? " alert" : "");
      b.innerHTML = esc(t.label) + ' <span class="' + cls + '">' + n + "</span>";
      b.addEventListener("click", function () { active = t.key; render(); });
      $tabs.appendChild(b);
    });
  }

  function matches(entry, term) {
    if (!term) return true;
    return JSON.stringify(entry).toLowerCase().indexOf(term.toLowerCase()) > -1;
  }

  function sortEntries(list) {
    const copy = list.slice();
    if (sortBy === "priority") {
      copy.sort(function (a, b) {
        const d = priorityRank(a.priority) - priorityRank(b.priority);
        return d !== 0 ? d : String(a.id).localeCompare(String(b.id), undefined, { numeric: true });
      });
    } else if (sortBy === "status") {
      const order = { attention: 0, open: 0, blocked: 1, progress: 2, decided: 3, done: 4 };
      copy.sort(function (a, b) {
        const d = (order[a.status] == null ? 9 : order[a.status]) - (order[b.status] == null ? 9 : order[b.status]);
        return d !== 0 ? d : String(a.id).localeCompare(String(b.id), undefined, { numeric: true });
      });
    } else if (sortBy === "recent") {
      copy.sort(function (a, b) { return String(b.ts || b.time || "").localeCompare(String(a.ts || a.time || "")); });
    } else {
      copy.sort(function (a, b) { return String(a.id).localeCompare(String(b.id), undefined, { numeric: true }); });
    }
    return copy;
  }

  // ---- renderers -----------------------------------------------------------
  function metaRow(it, term) {
    return '<div class="meta">' +
      (it.priority ? '<span class="pill prio prio-' + esc(it.priority) + '">' + esc(PRIORITY_LABEL[it.priority] || it.priority) + "</span>" : "") +
      '<span class="pill ' + pillClass(it.status) + '">' + esc(statusLabel(it.status)) + "</span>" +
      (it.tags || []).map(function (t) { return '<span class="pill p-tag">' + mark(t, term) + "</span>"; }).join("") +
      (it.ts ? '<span class="ts">' + esc(it.ts) + "</span>" : "") +
      "</div>";
  }

  function fold(label, inner) {
    return '<details class="fold"><summary><span class="caret" aria-hidden="true"></span>' +
      esc(label) + "</summary>" + '<div class="fold-body">' + inner + "</div></details>";
  }

  function renderWork(list, term) {
    if (!list.length) return '<p class="empty">Nothing here right now.</p>';
    return list.map(function (it) {
      const sols = (it.solutions || []).map(function (o) {
        return '<li class="opt">' +
          '<div class="opt-head">' +
            '<span class="opt-key">' + esc(o.key) + "</span>" +
            '<span class="opt-text">' + mark(o.text, term) + "</span>" +
            (o.recommended ? '<span class="rec-flag">Recommended</span>' : "") +
          "</div>" +
          (o.pro ? '<div class="tr"><span class="tr-lab pro">Pro</span><span class="tr-val">' + mark(o.pro, term) + "</span></div>" : "") +
          (o.con ? '<div class="tr"><span class="tr-lab con">Con</span><span class="tr-val">' + mark(o.con, term) + "</span></div>" : "") +
          "</li>";
      }).join("");

      // Resolution renders OPEN and ABOVE the folds: on a completed item what
      // was decided is the headline, not the deliberation that produced it.
      const res = it.resolution
        ? '<div class="resolution"><div class="rk">Resolved — ' + esc(it.resolution.date) + "</div>" +
          "<div>" + mark(it.resolution.text, term) + "</div></div>"
        : "";

      return '<article class="item">' +
        '<div class="id">' + esc(it.id) + "</div>" +
        '<div class="body">' +
          "<h3>" + mark(it.title, term) + "</h3>" +
          (it.problem ? '<p class="problem">' + mark(it.problem, term) + "</p>" : "") +
          res +
          (it.context ? fold("Context", "<p>" + mark(it.context, term) + "</p>") : "") +
          (sols ? fold("Solutions (" + it.solutions.length + ")", '<ul class="opts">' + sols + "</ul>") : "") +
          metaRow(it, term) +
        "</div></article>";
    }).join("");
  }

  function renderItems(list, term) {
    if (!list.length) return '<p class="empty">No entries match.</p>';
    return list.map(function (it) {
      return '<article class="item">' +
        '<div class="id">' + esc(it.id) + "</div>" +
        '<div class="body">' +
          "<h3>" + mark(it.title, term) + "</h3>" +
          (it.body ? "<p>" + mark(it.body, term) + "</p>" : "") +
          metaRow(it, term) +
        "</div></article>";
    }).join("");
  }

  function renderTimeline(list, term) {
    if (!list.length) return '<p class="empty">Nothing logged yet.</p>';
    return '<div class="tl">' + list.map(function (it) {
      return '<div class="tl-row ' + esc(it.severity || "ok") + '">' +
        '<div class="tl-time">' + esc(it.time) + "</div>" +
        '<div class="tl-dot" aria-hidden="true"></div>' +
        '<div class="tl-body"><h4>' + mark(it.title, term) + "</h4>" +
        (it.body ? "<p>" + mark(it.body, term) + "</p>" : "") + "</div>" +
        "</div>";
    }).join("") + "</div>";
  }

  // ---- main ----------------------------------------------------------------
  function render() {
    buildTabs();
    const tab = tabOf(active);
    if (!tab) { $panels.innerHTML = '<p class="empty">No tabs defined.</p>'; return; }

    $rule.textContent = tab.rule || "";
    const term = queries[tab.key] || "";
    if ($q.value !== term) $q.value = term;

    // The status filter buttons only make sense where an entry's status is not
    // already implied by the tab itself. Work tabs ARE status filters; timeline
    // has no status at all.
    const showFilters = tab.kind === "items";
    $filters.hidden = !showFilters;

    let list = rowsFor(tab).filter(function (e) { return matches(e, term); });
    if (showFilters && filter !== "all") {
      list = list.filter(function (e) { return e.status === filter; });
    }
    list = sortEntries(list);

    let html;
    if (tab.kind === "work") html = renderWork(list, term);
    else if (tab.kind === "timeline") html = renderTimeline(list, term);
    else html = renderItems(list, term);

    $panels.innerHTML = '<section class="panel on">' + html + "</section>";
  }

  $q.addEventListener("input", function (e) {
    queries[active] = e.target.value.trim();
    render();
  });
  $sort.addEventListener("change", function (e) { sortBy = e.target.value; render(); });
  $filters.querySelectorAll(".fbtn[data-f]").forEach(function (b) {
    b.addEventListener("click", function () {
      filter = b.dataset.f;
      $filters.querySelectorAll(".fbtn[data-f]").forEach(function (x) { x.classList.toggle("on", x === b); });
      render();
    });
  });

  render();
})();
</script>
