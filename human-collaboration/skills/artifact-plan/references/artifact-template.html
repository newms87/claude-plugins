<style>
/* ==========================================================================
   EXTRACTION CORRECTNESS — a forensic working record.

   The register is an instrument readout, not a document: this page is scanned
   and operated. Every colour is a token defined in bare :root (the complete
   light palette) and merely RE-VALUED in the two dark blocks, so the un-stamped
   "system" state renders correctly. Never declare a colour for the first time
   inside a media or [data-theme] block.

   Three type roles, one family. Plex Sans = chrome. Plex Serif = narrative
   prose, because the problem statements are genuinely long-form. Plex Mono =
   every piece of recorded evidence, so quoted material is visibly not prose.
   ========================================================================== */
:root {
  color-scheme: light;

  --ground:#f4f6f8;  --surface:#ffffff;  --surface-2:#eef1f5;  --evid:#f0f3f7;
  --ink:#0f1319;     --ink-2:#4d5866;    --ink-3:#7a8697;
  --line:#dde3ea;    --line-2:#c8d1dc;
  --accent:#1c53c6;  --accent-soft:#e8eefc;  --accent-line:#b9cdf3;
  --ok:#0d6f4c;      --ok-soft:#e2f3ec;
  --warn:#8a5a06;    --warn-soft:#fbf0dc;
  --crit:#a81f1a;    --crit-soft:#fbe6e4;
  --shadow:0 1px 2px rgba(15,19,25,.05), 0 8px 24px -12px rgba(15,19,25,.16);

  --sans:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --serif:"IBM Plex Serif", ui-serif, Georgia, serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground:#0d1117;  --surface:#141a22;  --surface-2:#1b222c;  --evid:#0f151d;
    --ink:#e7ecf3;     --ink-2:#a3afbf;    --ink-3:#71808f;
    --line:#242d39;    --line-2:#33404f;
    --accent:#7aa2ff;  --accent-soft:#16203a;  --accent-line:#2c3f66;
    --ok:#4cc38a;      --ok-soft:#0f2a20;
    --warn:#e3a44f;    --warn-soft:#2c2113;
    --crit:#ff8a80;    --crit-soft:#331917;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground:#0d1117;  --surface:#141a22;  --surface-2:#1b222c;  --evid:#0f151d;
  --ink:#e7ecf3;     --ink-2:#a3afbf;    --ink-3:#71808f;
  --line:#242d39;    --line-2:#33404f;
  --accent:#7aa2ff;  --accent-soft:#16203a;  --accent-line:#2c3f66;
  --ok:#4cc38a;      --ok-soft:#0f2a20;
  --warn:#e3a44f;    --warn-soft:#2c2113;
  --crit:#ff8a80;    --crit-soft:#331917;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}

* { box-sizing: border-box; }
body {
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap { max-width:1120px; margin:0 auto; padding:32px 22px 96px; }

/* ---- header ---- */
.top { display:flex; justify-content:space-between; align-items:flex-start; gap:24px; flex-wrap:wrap; margin-bottom:26px; }
.titlebar { display:flex; align-items:center; gap:14px; }
.logo {
  width:44px; height:44px; flex:none; border-radius:9px; display:grid; place-items:center;
  background:var(--accent); color:#fff; font-family:var(--mono); font-weight:600;
  font-size:15px; letter-spacing:.02em;
}
.titletext h1 { margin:0; font-size:23px; font-weight:650; letter-spacing:-.02em; text-wrap:balance; }
.titletext .sub { color:var(--ink-3); font-size:13px; margin-top:2px; }
.ways { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
.ways-lab, .chip {
  font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.09em;
}
.ways-lab { color:var(--ink-3); margin-right:2px; }
.chip { padding:3px 8px; border:1px solid var(--line); border-radius:99px; color:var(--ink-2); background:var(--surface); }

/* ---- tabs ---- */
.tabs { display:flex; flex-wrap:wrap; gap:2px; border-bottom:1px solid var(--line); }
.tabs button {
  appearance:none; cursor:pointer; font:inherit; font-size:13.5px; font-weight:500;
  padding:9px 13px; background:none; border:0; border-bottom:2px solid transparent;
  color:var(--ink-3); margin-bottom:-1px;
}
.tabs button:hover { color:var(--ink); }
.tabs button.on { color:var(--ink); border-bottom-color:var(--accent); font-weight:600; }
.tabs .cnt {
  font-family:var(--mono); font-size:11px; margin-left:6px; padding:1px 6px;
  border-radius:99px; background:var(--surface-2); color:var(--ink-3);
  font-variant-numeric:tabular-nums;
}
.tabs .cnt.alert { background:var(--crit-soft); color:var(--crit); font-weight:600; }
.tabs button:focus-visible, .fbtn:focus-visible, .search input:focus-visible,
.fold summary:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }

/* ---- tab rule ---- */
.rule {
  margin:14px 0 0; padding:12px 14px; font-size:13px; line-height:1.6; color:var(--ink-2);
  background:var(--accent-soft); border:1px solid var(--accent-line); border-radius:8px;
  max-width:78ch;
}

/* ---- controls ---- */
.controls { display:flex; gap:9px; align-items:center; margin:16px 0 20px; flex-wrap:wrap; }
.search { position:relative; flex:1; min-width:220px; }
.search .ico { position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--ink-3); font-size:14px; }
.search input {
  width:100%; font:inherit; font-size:13.5px; padding:8px 11px 8px 31px;
  background:var(--surface); color:var(--ink);
  border:1px solid var(--line); border-radius:8px;
}
.search input::placeholder { color:var(--ink-3); }
.fbtn {
  appearance:none; font:inherit; font-size:12.5px; cursor:pointer; padding:7px 11px;
  border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink-2);
}
.fbtn:hover { border-color:var(--line-2); color:var(--ink); }
.fbtn.on { background:var(--accent-soft); border-color:var(--accent-line); color:var(--accent); font-weight:600; }
.filters { display:flex; gap:6px; }
.filters[hidden] { display:none; }

/* ---- item cards ---- */
.panel { display:flex; flex-direction:column; gap:12px; }
.item {
  display:grid; grid-template-columns:auto 1fr; gap:0 14px; align-items:start;
  background:var(--surface); border:1px solid var(--line); border-radius:10px;
  padding:15px 17px 15px 15px; box-shadow:var(--shadow);
  border-left:3px solid var(--line-2);
}
.item.sev-critical  { border-left-color:var(--crit); }
.item.sev-very_high { border-left-color:var(--warn); }
.item.sev-high      { border-left-color:var(--accent); }
.item .id {
  font-family:var(--mono); font-size:11.5px; font-weight:600; color:var(--ink-3);
  padding-top:3px; font-variant-numeric:tabular-nums;
}
.item .body { min-width:0; }
.item h3 { margin:0 0 6px; font-size:16.5px; font-weight:650; letter-spacing:-.015em; line-height:1.35; text-wrap:balance; }
.item .problem { margin:0; font-family:var(--serif); font-size:14.5px; line-height:1.65; color:var(--ink-2); max-width:74ch; }
.item > .body > p { margin:0; font-family:var(--serif); font-size:14.5px; line-height:1.65; color:var(--ink-2); max-width:74ch; }

/* ---- resolution ---- */
.resolution {
  margin-top:11px; padding:11px 13px; border-radius:8px;
  background:var(--ok-soft); border:1px solid color-mix(in srgb, var(--ok) 26%, transparent);
}
.resolution .rk {
  font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.09em;
  color:var(--ok); font-weight:600; margin-bottom:4px;
}
.resolution > div:last-child { font-family:var(--serif); font-size:14px; line-height:1.6; max-width:74ch; }

/* ---- folds ---- */
.fold { margin-top:11px; border-top:1px solid var(--line); padding-top:9px; }
.fold summary {
  cursor:pointer; list-style:none; font-family:var(--mono); font-size:11px;
  text-transform:uppercase; letter-spacing:.09em; color:var(--ink-3);
  display:flex; align-items:center; gap:7px; user-select:none;
}
.fold summary::-webkit-details-marker { display:none; }
.fold summary:hover { color:var(--ink); }
.caret { width:0; height:0; border-left:5px solid currentColor; border-top:3.5px solid transparent; border-bottom:3.5px solid transparent; transition:transform .15s; }
.fold[open] .caret { transform:rotate(90deg); }
.fold-body { margin-top:11px; }

/* ==========================================================================
   RICH CONTEXT — the part that matters. Recorded evidence is not prose and
   must not render as prose. Narrative sets in serif at a readable measure;
   quoted material sets in mono on its own ground with its own scroll.
   ========================================================================== */
.rt { display:flex; flex-direction:column; gap:11px; }
.rt > p {
  margin:0; font-family:var(--serif); font-size:14.5px; line-height:1.68;
  color:var(--ink-2); max-width:74ch;
}
.rt h5 {
  margin:9px 0 0; font-family:var(--mono); font-size:11px; font-weight:600;
  text-transform:uppercase; letter-spacing:.1em; color:var(--ink);
  display:flex; align-items:center; gap:10px;
}
.rt h5::after { content:""; flex:1; height:1px; background:var(--line); }
.rt h5:first-child { margin-top:0; }
/* An ALL-CAPS lead-in is how this record signals a claim. Make it typographic. */
.rt .lead { font-family:var(--sans); font-weight:650; font-size:13px; letter-spacing:.01em; color:var(--ink); }
.rt code {
  font-family:var(--mono); font-size:.88em; padding:1px 5px; border-radius:4px;
  background:var(--surface-2); border:1px solid var(--line); color:var(--ink);
}
.rt strong { color:var(--ink); font-weight:650; }
.ev {
  margin:0; padding:11px 13px; overflow-x:auto;
  background:var(--evid); border:1px solid var(--line); border-left:2px solid var(--accent-line);
  border-radius:7px;
  font-family:var(--mono); font-size:12.5px; line-height:1.62; color:var(--ink-2);
  font-variant-numeric:tabular-nums; white-space:pre; tab-size:2;
}
.ev.sev-crit { border-left-color:var(--crit); }
.ev.sev-ok   { border-left-color:var(--ok); }

/* ---- solutions ---- */
.opts { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px; }
.opt { border:1px solid var(--line); border-radius:9px; padding:11px 13px; background:var(--surface-2); }
.opt.rec { border-color:var(--ok); background:var(--ok-soft); }
.opt-head { display:flex; gap:9px; align-items:baseline; flex-wrap:wrap; margin-bottom:7px; }
.opt-key {
  font-family:var(--mono); font-weight:600; font-size:12px; color:var(--ink);
  background:var(--surface); border:1px solid var(--line); border-radius:5px;
  padding:1px 7px; flex:none;
}
.opt-text { font-weight:550; flex:1; min-width:200px; font-size:14px; line-height:1.5; }
.rec-flag {
  font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.09em;
  color:var(--ok); font-weight:600; border:1px solid currentColor; border-radius:99px; padding:2px 7px;
}
.tr { display:grid; grid-template-columns:44px 1fr; gap:9px; align-items:baseline; margin-top:5px; }
.tr-lab {
  font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.09em; font-weight:600;
}
.tr-lab.pro { color:var(--ok); } .tr-lab.con { color:var(--warn); }
.tr-val { font-size:13.5px; line-height:1.55; color:var(--ink-2); max-width:70ch; }

/* ---- decision controls ----
   The reader answers an open question by clicking, and the page publishes
   itself with the answer in it. Rendered ONLY once the page has confirmed it
   can actually write — see "THE DECISION CHANNEL" in the script below. No new
   colours: the accent button is the same accent as the logo and the tab rule,
   and the strip sits on the option card's own border. */
.opt-act {
  display:flex; align-items:center; gap:9px; flex-wrap:wrap;
  margin-top:9px; padding-top:9px; border-top:1px solid var(--line);
}
.choose {
  appearance:none; font:inherit; font-size:12.5px; font-weight:600; cursor:pointer;
  padding:6px 12px; border-radius:8px; border:1px solid var(--accent);
  background:var(--accent); color:#fff;
}
.choose:hover { filter:brightness(1.08); }
.choose.ghost { background:var(--surface); color:var(--ink-2); border-color:var(--line); filter:none; }
.choose.ghost:hover { color:var(--ink); border-color:var(--line-2); }
.choose:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.opt-act .ask { font-size:13px; line-height:1.5; color:var(--ink-2); flex:1; min-width:220px; }
.opt-act .ask strong { color:var(--ink); font-weight:650; }
.opt-act .say {
  font-family:var(--mono); font-size:10.5px; text-transform:uppercase;
  letter-spacing:.08em; color:var(--ink-3);
}

/* One page-level strip, used for the read-only answer and for reporting a
   click that a competing publish beat to the record. */
.notice {
  margin:16px 0 0; padding:11px 13px; border-radius:8px;
  font-size:13px; line-height:1.55; max-width:78ch;
  background:var(--accent-soft); border:1px solid var(--accent-line); color:var(--ink-2);
}
.notice.bad { background:var(--crit-soft); border-color:var(--crit); color:var(--crit); }

/* ---- meta pills ---- */
.meta { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:11px; }
.pill {
  font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.07em;
  padding:2px 8px; border-radius:99px; border:1px solid var(--line); color:var(--ink-2); background:var(--surface-2);
}
.prio-critical  { color:var(--crit); background:var(--crit-soft); border-color:currentColor; font-weight:600; }
.prio-very_high { color:var(--warn); background:var(--warn-soft); border-color:currentColor; font-weight:600; }
.prio-high      { color:var(--accent); background:var(--accent-soft); border-color:var(--accent-line); }
.p-attention { color:var(--crit); background:var(--crit-soft); border-color:currentColor; font-weight:600; }
.p-progress  { color:var(--accent); background:var(--accent-soft); border-color:var(--accent-line); }
.p-done, .p-decided { color:var(--ok); background:var(--ok-soft); border-color:currentColor; }
.p-blocked { color:var(--warn); background:var(--warn-soft); border-color:currentColor; }
.ts { font-family:var(--mono); font-size:10.5px; color:var(--ink-3); margin-left:auto; font-variant-numeric:tabular-nums; }

/* ---- timeline ---- */
.tl { display:flex; flex-direction:column; }
.tl-row { display:grid; grid-template-columns:132px 18px 1fr; gap:0 12px; align-items:start; padding-bottom:18px; position:relative; }
.tl-row::before { content:""; position:absolute; left:140px; top:16px; bottom:-2px; width:1px; background:var(--line); }
.tl-row:last-child::before { display:none; }
.tl-time { font-family:var(--mono); font-size:11px; color:var(--ink-3); text-align:right; padding-top:2px; font-variant-numeric:tabular-nums; }
.tl-dot { width:9px; height:9px; border-radius:99px; background:var(--ok); margin:5px 0 0 0; z-index:1; box-shadow:0 0 0 3px var(--ground); }
.tl-row.warn .tl-dot { background:var(--warn); }
.tl-row.crit .tl-dot { background:var(--crit); }
.tl-body h4 { margin:0 0 4px; font-size:14.5px; font-weight:600; letter-spacing:-.01em; line-height:1.4; }
.tl-body p { margin:0; font-family:var(--serif); font-size:13.5px; line-height:1.62; color:var(--ink-2); max-width:74ch; }

.empty { color:var(--ink-3); font-size:14px; padding:28px 0; text-align:center; }
mark { background:color-mix(in srgb, var(--accent) 24%, transparent); color:inherit; border-radius:3px; padding:0 2px; }
.foot { margin-top:34px; padding-top:16px; border-top:1px solid var(--line); color:var(--ink-3); font-size:12.5px; max-width:74ch; }

@media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
@media (max-width: 700px) {
  .wrap { padding:20px 13px 72px; }
  .item { grid-template-columns:1fr; gap:6px; }
  .item .id { padding-top:0; }
  .tl-row { grid-template-columns:1fr; gap:2px; }
  .tl-row::before, .tl-dot { display:none; }
  .tl-time { text-align:left; }
  .ts { margin-left:0; }
}
</style>

     downward and stops when they run out of time, and what they skipped is what
     you said mattered least.

     by how interesting the finding is, not by how recently you found it, and
     never by how much you want it looked at. A defect that silently corrupts a
     user's data outranks a defect that loudly stops a test run, because the loud
     one announces itself and the silent one does not.

     critical   data loss, data corruption, a security or privacy exposure, or
                anything already affecting production right now
     very_high  blocks the stated goal, or blocks the human from trusting a
                result they are about to act on
     high       a real defect with a real consequence, not yet biting
     medium     the default. Worth doing; nothing breaks while it waits
     low        cleanup, consistency, ergonomics
     lowest     noted so it is not rediscovered; may never be done

     degrades to mid-list instead of silently burying the item. Re-rank when the
     evidence changes — a finding that turns out to be a checker artifact drops,
     and one that turns out to be reaching production climbs.

     ---------------------------------------------------------------------------
     3. IDS ARE PERMANENT
     ---------------------------------------------------------------------------
     Append only. Never renumber to close a gap. Never re-prefix. A deleted
     item's number is retired, not recycled. The human refers to entries by id
     in chat ("what happened to W-4?") and an id that shifted meaning is worse
     than a missing entry.

     ---------------------------------------------------------------------------
     3a. WRITE FOR A STRANGER — the reader knows engineering, not THIS
     ---------------------------------------------------------------------------
     Assume every entry is read by an experienced engineer who has never seen
     this codebase, this product, or this conversation. They know how software
     works. They do not know what your services are called, what your domain
     words mean, or what happened yesterday. Write for that person, always —
     not for whoever happened to do the work.

     This is not a politeness rule. The page exists to survive compaction, hand
     off to another agent, and be re-read weeks later by someone who has
     forgotten the details — INCLUDING the person who wrote it. An entry only
     its author can decode has already failed at its one job.

     TITLE: LEAD WITH THE DOMAIN, THEN SAY THE THING IN PLAIN WORDS.
       The title is often all the human reads. It must place them — WHERE in the
       system is this? — and then say what is actually wrong or needed, in
       language that survives having no context.
         BAD   "Fix splitObjectName staleness in DemandHeader"
         BAD   "DanxbotClient::cancel is not gated"
         GOOD  "Demand list vs detail page — one case shows two different names"
         GOOD  "danxbot safety rule — it describes a call that does not exist"

       LATER, as a pointer; it may not be the thing that carries the meaning.

     PROBLEM: WHAT IS WRONG AND WHO IT HURTS, IN 1-3 SENTENCES.
       No jargon, no symbol names. If a reader cannot tell from this alone why
       anyone should care, it is not written yet.

     CONTEXT: ORIENT FIRST, THEN GO DEEP.
       Every context block opens by explaining the thing before discussing it —
       what this part of the system IS, what the domain words mean, and why it
       exists at all. Only after that: the evidence, the measurements, the file
       paths, the history. A reader must never meet a proper noun before its
       definition.

       command to run, the three clicks that reproduce it. A reader who can
       reproduce something can decide about it; a reader who cannot is taking
       your word.

       maintaining it? "Touches three components" is not a cost. "A screen of
       cards headed by a filename is a screen of noise" is.

     here. Could they act on it without asking you a single question? If not,
     what is missing is orientation, and orientation goes at the top.

     than no timestamp, because it makes a stale item look fresh.

  }
  function tabOf(key) { return TABS.filter(function (t) { return t.key === key; })[0]; }

  // A tab's rows: its source array, narrowed by the tab's own status filter.
  function rowsFor(tab) {
    const all = DATA[tab.from] || [];
    return tab.status ? all.filter(function (e) { return e.status === tab.status; }) : all;
  }

  // ==========================================================================
  // THE DECISION CHANNEL
  //
  // The reader clicks an option; the page rewrites its own DATA with that
  // decision and publishes itself as a new version. The Claude session that
  // published this page is subscribed to its live changes, so the republish IS
  // the message back — no typing, no copy-paste.
  //
  // Four rules this code must never break:
  //   1. NEVER SERIALIZE THE LIVE DOM. PAGE_SOURCE was captured before this
  //      engine touched anything, and the only thing rewritten in it is the
  //      DATA literal. Fold state, scroll position and the search box can
  //      therefore never leak into the published record.
  //   2. NEVER LEAVE A DEAD CONTROL. Buttons appear only once the capability
  //      has actually resolved, and are removed the moment a call says this
  //      view cannot write.
  //   3. NEVER RETRY A CONFLICT. The shell is already reloading every open view
  //      to the winning version; a retry would fight it.
  //   4. NEVER PUBLISH ON A SINGLE CLICK. A misclick that silently rewrites the
  //      shared record and pings a session is worse than one extra click.
  // ==========================================================================

  // Codes that are permanent for this view. Any of them means: stop offering to
  // write, and say the view is read-only rather than that something failed.
  const CAP_TERMINAL = {
    not_writer: 1, not_granted: 1, not_declared: 1, consent_required: 1,
    capability_disabled: 1, capability_removed: 1,
  };
  let capState = "pending";        // "pending" -> "ready" | "none"
  let publisher = null;            // the resolved `artifact` namespace
  let publishing = false;          // one publish at a time

  // Real clock, formatted the way every `ts` on this page is written.
  function utcStamp(d) {
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return d.getUTCFullYear() + "-" + p(d.getUTCMonth() + 1) + "-" + p(d.getUTCDate()) +
      " " + p(d.getUTCHours()) + ":" + p(d.getUTCMinutes()) + " UTC";
  }

  // An item is decidable while it is still the human's call: in Needs Attention,
  // not yet resolved, and carrying options to choose between.
  function decidable(it) {
    return it.status === "attention" && !it.resolution && (it.solutions || []).length > 0;
  }

  // Rendered inside every eligible option. It starts as a line of text, not a
  // control — the capability has not answered yet and may never answer.
  function actSlot(it, o) {
    if (!decidable(it)) return "";
    return '<div class="opt-act" data-w="' + esc(it.id) + '" data-k="' + esc(o.key) + '">' +
      '<span class="say">Checking whether this view can record decisions&#8230;</span></div>';
  }
  function idleMarkup(key) {
    return '<button class="choose" type="button" data-act="ask">Choose ' + esc(key) + "</button>" +
      '<span class="say">Records it here and tells Claude</span>';
  }
  function confirmMarkup(id, key) {
    return '<span class="ask">Record <strong>option ' + esc(key) + "</strong> as the decision for " +
      esc(id) + "? This publishes a new version of this page and notifies the Claude session " +
      "watching it.</span>" +
      '<button class="choose" type="button" data-act="go">Yes, record it</button>' +
      '<button class="choose ghost" type="button" data-act="cancel">Cancel</button>';
  }
  function slotSays(slot, msg, retryable) {
    slot.innerHTML = '<span class="ask">' + esc(msg) + "</span>" +
      (retryable ? '<button class="choose ghost" type="button" data-act="ask">Try again</button>' : "");
  }

  // Every slot on screen is brought to the current capability state. This is a
  // targeted update, never a re-render: a re-render would collapse a fold the
  // reader had just opened, and the capability can resolve up to 10s late.
  function applyCapability() {
    const slots = $panels.querySelectorAll(".opt-act");
    for (let i = 0; i < slots.length; i++) {
      if (capState === "ready") slots[i].innerHTML = idleMarkup(slots[i].getAttribute("data-k"));
      else if (capState === "none") slots[i].parentNode.removeChild(slots[i]);
    }
  }

  // One page-level strip, above the panel. Used only when the reader is owed an
  // answer they cannot get from a slot.
  function notice(text, tone) {
    let el = document.getElementById("notice");
    if (!el) {
      el = document.createElement("div");
      el.id = "notice";
      $panels.parentNode.insertBefore(el, $panels);
    }
    el.className = "notice" + (tone ? " " + tone : "");
    el.textContent = text;
  }

  function goReadOnly() {
    capState = "none"; publisher = null; publishing = false;
    applyCapability();
    notice("This view can read this page but cannot write to it, so decisions cannot be " +
      "recorded from here. Tell Claude which option you want instead.", "");
  }

  function workById(id) {
    const all = DATA.work || [];
    for (let i = 0; i < all.length; i++) { if (all[i].id === id) return all[i]; }
    return null;
  }
  function optionOf(it, key) {
    const sols = (it && it.solutions) || [];
    for (let i = 0; i < sols.length; i++) { if (String(sols[i].key) === String(key)) return sols[i]; }
    return null;
  }

  // ---- rewriting this page's own source ------------------------------------
  // PAGE_SOURCE still holds the ORIGINAL DATA literal and none of the render
  // output. Swapping that one literal for the current DATA yields the page as
  // it would have been authored with this decision already in it.
  //
  // The literal is found the way the generator writes it: `const DATA = {` at
  // the start of a line, closed by `};` at the start of a line. Everything
  // nested inside DATA is indented, so the first line-start `};` after the
  // opening brace is DATA's own. The guard below refuses to publish rather than
  // risk a corrupt page: if a top-level declaration turns up inside what was
  // matched, the anchor found something that is not DATA.
  function sourceWithData(src, data) {
    const head = "\nconst DATA = ";
    const at = src.indexOf(head);
    if (at < 0) return null;
    const open = src.indexOf("{", at + head.length);
    if (open < 0) return null;
    const close = src.indexOf("\n};", open);
    if (close < 0) return null;
    if (src.slice(open, close).indexOf("\nconst ") > -1) return null;
    return src.slice(0, at + 1) + "const DATA = " +
      JSON.stringify(data, null, 2) + ";" + src.slice(close + 3);
  }

  // ---- the publish ---------------------------------------------------------
  function recordChoice(id, key, slot, attempt) {
    if (publishing || capState !== "ready" || !publisher) return;
    const it = workById(id);
    const opt = optionOf(it, key);
    if (!it || !opt) {
      slotSays(slot, "That option is no longer on this page. Reload and choose again.", false);
      return;
    }

    const stamp = utcStamp(new Date());
    const before = { status: it.status, resolution: it.resolution, ts: it.ts };

    // `choice` is the machine-readable half: WHICH option was chosen is
    // recorded as the option's own key and its exact text, never inferred from
    // the prose. `text` says the same thing for a human reader.
    it.resolution = {
      date: stamp.slice(0, 10),
      text: "Chose " + opt.key + " — " + opt.text +
        " (recorded from this page by the reader, " + stamp + ").",
      choice: { key: String(opt.key), text: String(opt.text), ts: stamp, via: "page" },
    };
    it.status = "progress";        // rule 1: a decided item leaves the tab by
    it.ts = stamp;                 // changing status, never by moving arrays.

    const next = sourceWithData(PAGE_SOURCE, DATA);
    if (!next) {
      it.status = before.status; it.resolution = before.resolution; it.ts = before.ts;
      slotSays(slot, "This page could not rewrite its own source, so nothing was published " +
        "and nothing was recorded. Tell Claude.", false);
      return;
    }

    publishing = true;
    slot.innerHTML = '<span class="say">Recording and publishing&#8230;</span>';
    publisher.publish(next).then(function () {
      // A successful `html` publish reloads every open view, this one included,
      // so there is nothing left to do but say so. `publishing` stays true on
      // purpose: no second publish from a view that is on its way out.
      slot.innerHTML = '<span class="say">Recorded. Reloading&#8230;</span>';
    }).catch(function (err) {
      publishing = false;
      it.status = before.status; it.resolution = before.resolution; it.ts = before.ts;
      const code = (err && err.code) || "upstream_error";

      if (CAP_TERMINAL[code]) { goReadOnly(); return; }

      if (code === "conflict") {
        // Routine, and NOT an error to apologise for: someone published first
        // and the shell is already reloading this view to their version. Never
        // retry. The click itself is lost across that reload, so leave a note
        // behind that survives it and say so plainly on the way back.
        try {
          sessionStorage.setItem("plan-lost-choice", JSON.stringify(
            { id: id, key: String(opt.key), ts: stamp }));
        } catch (e) { /* private window or blocked storage — the line below still shows */ }
        slotSays(slot, "A newer version of this page was published first, so this choice was " +
          "NOT recorded. This view is reloading to that version — choose again there.", false);
        return;
      }
      if (code === "rate_limited") {
        slotSays(slot, "This page is publishing too often right now. Wait a few seconds, " +
          "then choose again.", true);
        return;
      }
      if (code === "too_large") {
        slotSays(slot, "This page is too large to publish from a view. Nothing was recorded — " +
          "tell Claude.", false);
        return;
      }
      if (code === "invalid_content" || code === "transform_error" || code === "read_only_path") {
        slotSays(slot, "The page this view built was rejected (" + code + "), so nothing was " +
          "recorded. Tell Claude.", false);
        return;
      }
      // upstream_error, and any code this page does not know, is treated as
      // transient: one retry after a short randomized delay, then stop.
      if (!attempt) {
        slot.innerHTML = '<span class="say">Publish failed, retrying once&#8230;</span>';
        setTimeout(function () { recordChoice(id, key, slot, 1); }, 400 + Math.floor(Math.random() * 700));
        return;
      }
      slotSays(slot, "The publish failed (" + code + ") and nothing was recorded.", true);
    });
  }

  // ---- chrome --------------------------------------------------------------
  function buildTabs() {
    $tabs.innerHTML = "";
    TABS.forEach(function (t) {
      const n = rowsFor(t).length;
      const b = document.createElement("button");
      b.type = "button";
      b.dataset.key = t.key;
      b.className = t.key === active ? "on" : "";
      b.setAttribute("aria-pressed", String(t.key === active));
      const cls = "cnt" + (t.badge === "alert" && n > 0 ? " alert" : "");
      b.innerHTML = esc(t.label) + ' <span class="' + cls + '">' + n + "</span>";
      b.addEventListener("click", function () { active = t.key; render(); });
      $tabs.appendChild(b);
    });
  }

  function matches(entry, term) {
    if (!term) return true;
    return JSON.stringify(entry).toLowerCase().indexOf(term.toLowerCase()) > -1;
  }

  function sortEntries(list) {
    const copy = list.slice();
    if (sortBy === "priority") {
      copy.sort(function (a, b) {
        const d = priorityRank(a.priority) - priorityRank(b.priority);
        return d !== 0 ? d : String(a.id).localeCompare(String(b.id), undefined, { numeric: true });
      });
    } else if (sortBy === "status") {
      const order = { attention: 0, open: 0, blocked: 1, progress: 2, decided: 3, done: 4 };
      copy.sort(function (a, b) {
        const d = (order[a.status] == null ? 9 : order[a.status]) - (order[b.status] == null ? 9 : order[b.status]);
        return d !== 0 ? d : String(a.id).localeCompare(String(b.id), undefined, { numeric: true });
      });
    } else if (sortBy === "recent") {
      copy.sort(function (a, b) { return String(b.ts || b.time || "").localeCompare(String(a.ts || a.time || "")); });
    } else {
      copy.sort(function (a, b) { return String(a.id).localeCompare(String(b.id), undefined, { numeric: true }); });
    }
    return copy;
  }

  // ---- renderers -----------------------------------------------------------
  function metaRow(it, term) {
    return '<div class="meta">' +
      (it.priority ? '<span class="pill prio prio-' + esc(it.priority) + '">' + esc(PRIORITY_LABEL[it.priority] || it.priority) + "</span>" : "") +
      '<span class="pill ' + pillClass(it.status) + '">' + esc(statusLabel(it.status)) + "</span>" +
      (it.tags || []).map(function (t) { return '<span class="pill p-tag">' + mark(t, term) + "</span>"; }).join("") +
      (it.ts ? '<span class="ts">' + esc(it.ts) + "</span>" : "") +
      "</div>";
  }

  function fold(label, inner) {
    return '<details class="fold"><summary><span class="caret" aria-hidden="true"></span>' +
      esc(label) + "</summary>" + '<div class="fold-body">' + inner + "</div></details>";
  }

  function renderWork(list, term) {
    if (!list.length) return '<p class="empty">Nothing here right now.</p>';
    return list.map(function (it) {
      const sols = (it.solutions || []).map(function (o) {
        return '<li class="opt' + (o.recommended ? " rec" : "") + '">' +
          '<div class="opt-head">' +
            '<span class="opt-key">' + esc(o.key) + "</span>" +
            '<span class="opt-text">' + inlineMd(o.text, term) + "</span>" +
            (o.recommended ? '<span class="rec-flag">Recommended</span>' : "") +
          "</div>" +
          (o.pro ? '<div class="tr"><span class="tr-lab pro">Pro</span><span class="tr-val">' + inlineMd(o.pro, term) + "</span></div>" : "") +
          (o.con ? '<div class="tr"><span class="tr-lab con">Con</span><span class="tr-val">' + inlineMd(o.con, term) + "</span></div>" : "") +
          actSlot(it, o) +
          "</li>";
      }).join("");

      // Resolution renders OPEN and ABOVE the folds: on a completed item what
      // was decided is the headline, not the deliberation that produced it.
      const res = it.resolution
        ? '<div class="resolution"><div class="rk">Resolved — ' + esc(it.resolution.date) + "</div>" +
          "<div>" + inlineMd(it.resolution.text, term) + "</div></div>"
        : "";

      return '<article class="item sev-' + esc(it.priority || "medium") + '">' +
        '<div class="id">' + esc(it.id) + "</div>" +
        '<div class="body">' +
          "<h3>" + mark(it.title, term) + "</h3>" +
          (it.problem ? '<p class="problem">' + inlineMd(it.problem, term) + "</p>" : "") +
          res +
          (it.context ? fold("Context", rich(it.context, term)) : "") +
          (sols ? fold("Solutions (" + it.solutions.length + ")", '<ul class="opts">' + sols + "</ul>") : "") +
          metaRow(it, term) +
        "</div></article>";
    }).join("");
  }

  function renderItems(list, term) {
    if (!list.length) return '<p class="empty">No entries match.</p>';
    return list.map(function (it) {
      return '<article class="item">' +
        '<div class="id">' + esc(it.id) + "</div>" +
        '<div class="body">' +
          "<h3>" + mark(it.title, term) + "</h3>" +
          (it.body ? rich(it.body, term) : "") +
          metaRow(it, term) +
        "</div></article>";
    }).join("");
  }

  function renderTimeline(list, term) {
    if (!list.length) return '<p class="empty">Nothing logged yet.</p>';
    return '<div class="tl">' + list.map(function (it) {
      return '<div class="tl-row ' + esc(it.severity || "ok") + '">' +
        '<div class="tl-time">' + esc(it.time) + "</div>" +
        '<div class="tl-dot" aria-hidden="true"></div>' +
        '<div class="tl-body"><h4>' + mark(it.title, term) + "</h4>" +
        (it.body ? "<p>" + inlineMd(it.body, term) + "</p>" : "") + "</div>" +
        "</div>";
    }).join("") + "</div>";
  }

  // ---- main ----------------------------------------------------------------
  function render() {
    buildTabs();
    const tab = tabOf(active);
    if (!tab) { $panels.innerHTML = '<p class="empty">No tabs defined.</p>'; return; }

    $rule.textContent = tab.rule || "";
    const term = queries[tab.key] || "";
    if ($q.value !== term) $q.value = term;

    // The status filter buttons only make sense where an entry's status is not
    // already implied by the tab itself. Work tabs ARE status filters; timeline
    // has no status at all.
    const showFilters = tab.kind === "items";
    $filters.hidden = !showFilters;

    let list = rowsFor(tab).filter(function (e) { return matches(e, term); });
    if (showFilters && filter !== "all") {
      list = list.filter(function (e) { return e.status === filter; });
    }
    list = sortEntries(list);

    let html;
    if (tab.kind === "work") html = renderWork(list, term);
    else if (tab.kind === "timeline") html = renderTimeline(list, term);
    else html = renderItems(list, term);

    $panels.innerHTML = '<section class="panel on">' + html + "</section>";
    applyCapability();
  }

  $q.addEventListener("input", function (e) {
    queries[active] = e.target.value.trim();
    render();
  });
  $sort.addEventListener("change", function (e) { sortBy = e.target.value; render(); });
  $filters.querySelectorAll(".fbtn[data-f]").forEach(function (b) {
    b.addEventListener("click", function () {
      filter = b.dataset.f;
      $filters.querySelectorAll(".fbtn[data-f]").forEach(function (x) { x.classList.toggle("on", x === b); });
      render();
    });
  });

  // Decision clicks, delegated — the panel is rebuilt on every render, so the
  // listener lives on the container that survives. The three steps are ask ->
  // confirm -> publish, and each step only ever rewrites its own slot, so a
  // reader who has opened three folds keeps all three open.
  $panels.addEventListener("click", function (e) {
    const btn = e.target && e.target.closest ? e.target.closest("button[data-act]") : null;
    if (!btn) return;
    const slot = btn.closest(".opt-act");
    if (!slot) return;
    const id = slot.getAttribute("data-w");
    const key = slot.getAttribute("data-k");
    const act = btn.getAttribute("data-act");
    if (act === "ask") slot.innerHTML = confirmMarkup(id, key);
    else if (act === "cancel") slot.innerHTML = idleMarkup(key);
    else if (act === "go") recordChoice(id, key, slot, 0);
  });

  // A click that a competing publish beat to the record is reported on the way
  // back, because the reload that follows a conflict throws away everything
  // this page held in memory.
  (function reportLostChoice() {
    let raw = null;
    try {
      raw = sessionStorage.getItem("plan-lost-choice");
      sessionStorage.removeItem("plan-lost-choice");
    } catch (e) { return; }
    if (!raw) return;
    let v = null;
    try { v = JSON.parse(raw); } catch (e) { return; }
    if (!v || !v.id) return;
    notice("Your choice of option " + v.key + " for " + v.id + " at " + v.ts + " was NOT recorded — " +
      "another version of this page was published first. Open " + v.id + " and choose again.", "bad");
  })();

  // The capability namespace resolves LATER than this script — never during its
  // first synchronous run, and up to 10s late when the host never answers. So
  // the page renders completely without it and the controls light up if and
  // when it arrives. `null` means this view cannot run the capability at all
  // (read-only viewer, not declared, module failed) — the slots are removed and
  // the page reads exactly as it did before any of this existed.
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("artifact").then(function (ns) {
      if (ns && typeof ns.publish === "function") { publisher = ns; capState = "ready"; }
      else { capState = "none"; }
      applyCapability();
    }).catch(function () { capState = "none"; applyCapability(); });
  } else {
    capState = "none";             // a saved copy, or any host that serves no runtime
  }

  render();
})();
</script>
